[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injection-scanner"
version = "0.1.0"
description = "Layered prompt-injection / secret-exfil scanner: unicode sanitize, secret-shape, honeypot."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jonathan Moregard" }]
license = { text = "MIT" }
dependencies = [
    # Major-version ceiling, added 2026-09-05 after an unbounded floor let the
    # anthropic SDK move 0.x -> 1.4.0 silently: 1.x removed `temperature` from
    # `messages.create`, so every L4 Anthropic judge call raised TypeError and
    # the layer fail-closed on benign agent-tooling research (eval fp_rate
    # 0.444). The floor is 1.0 because that is the major this code is written
    # and tested against; the ceiling makes the next major a reviewed change
    # rather than a silent one. tests/test_judge.py drives the installed SDK
    # over a stub transport so a signature break fails locally, not in CI.
    "anthropic>=1.0,<2",
    # Same shape for openai, added the same day: the floor had been 2.32.0 and
    # the installed SDK was 3.8.0, so one major had already been crossed
    # unreviewed — it merely happened not to break anything. Floor at the
    # major the code is tested against, ceiling so the next one is a change.
    "openai>=3,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    # tests/test_honeypot_api_error_audit.py builds SDK error objects from
    # httpx.Request/Response. The SDKs themselves pull httpx2, so httpx is
    # not otherwise installed and a clean `.[test]` install failed at
    # collection once CI started running the whole tests/ tree.
    "httpx>=0.28,<1",
    # tests/test_ci_relations.py parses .github/workflows/{ci,live-eval}.yml
    # to assert that the merge gate stays hermetic and the live jobs stay
    # serialised. TEST-only: the scanner itself parses no YAML and must not
    # gain a runtime dependency for a CI guard. Major-version ceiling for the
    # same reason as the SDK pins above — the next major is a reviewed
    # change, not a silent one.
    "pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
include = ["injection_scanner*"]
exclude = ["tests*"]
