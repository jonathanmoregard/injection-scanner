[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injection-scanner"
version = "0.1.0"
description = "Layered prompt-injection / secret-exfil scanner: unicode sanitize, secret-shape, honeypot."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jonathan Moregard" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.96.0",
    "openai>=2.32.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["injection_scanner*"]
exclude = ["tests*"]
