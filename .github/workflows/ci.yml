name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: install package + test extra
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[test]"

      # Deterministic suite — no API keys, no network. The whole tests/ tree
      # is key-free (measured 2026-09-05: 436 passed with ANTHROPIC_API_KEY,
      # OPENAI_API_KEY and LAKERA_API_KEY all unset), so it runs in full here.
      # It used to run an explicit four-file list, which left test_judge.py
      # out — so the anthropic-SDK signature break only surfaced in the
      # live-key `eval` job. test_payload.py is a CLI tool with no test_
      # functions; pytest collects nothing from it.
      - name: pytest
        run: .venv/bin/python -m pytest tests/ -v

  smoke:
    name: smoke (full pipeline incl. honeypot)
    runs-on: ubuntu-latest
    needs: test
    # Skip on forks — secrets aren't available there, and we don't want
    # CI to fail for outside contributors. Maintainers re-run via PR
    # from a branch in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: install package
        run: |
          uv venv --python 3.12
          uv pip install -e .

      # Live e2e: deterministic canaries (no API) + 1 benign liveness
      # probe that hits Lakera Guard (L2) plus Anthropic + OpenAI (L3
      # honeypot). Runs against the SHA being merged so a PR that breaks
      # L2/L3 integration (broken scenario file, SDK incompat, Lakera
      # schema drift, etc.) cannot reach main. Because the Lakera gate
      # fails closed on a missing key, LAKERA_API_KEY is now required.
      - name: run_smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LAKERA_API_KEY: ${{ secrets.LAKERA_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$OPENAI_API_KEY" ] || [ -z "$LAKERA_API_KEY" ]; then
            echo "::error::Missing ANTHROPIC_API_KEY, OPENAI_API_KEY, or LAKERA_API_KEY secret. Add via: gh secret set <NAME> -R jonathanmoregard/injection-scanner"
            exit 1
          fi
          .venv/bin/python -c "
          import logging, sys
          logging.basicConfig(level=logging.INFO, format='%(levelname)s %(message)s')
          from injection_scanner.smoke import SmokeFailure, run_smoke
          try:
              run_smoke(log_info=logging.info, log_error=logging.error)
          except SmokeFailure as e:
              print(f'::error::smoke failed: {e.reason}', file=sys.stderr)
              sys.exit(2)
          "

  eval:
    name: eval (full pipeline, recall floor + FP ceiling)
    runs-on: ubuntu-latest
    needs: test
    # Same fork guard as smoke: secrets aren't available on fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: install package
        run: |
          uv venv --python 3.12
          uv pip install -e .

      # Scored gate over the labeled corpus with EVERY hosted layer live
      # (Lakera + honeypot + L4 judge arbitration). Two hard thresholds:
      #   --min-recall 1.0   every labeled injection must still be blocked
      #   --max-fp-rate 0.0  no benign fixture may be quarantined — this is
      #                      what keeps the 2026-07-28 agent-tooling FP
      #                      class (fp_* cases) from regressing.
      - name: eval corpus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LAKERA_API_KEY: ${{ secrets.LAKERA_API_KEY }}
        run: |
          .venv/bin/python -m injection_scanner.eval tests/payloads/labels.jsonl --use-lakera --use-honeypot --min-recall 1.0 --max-fp-rate 0.0
